# 拾光互助 - 阿里云 ECS Docker Compose 部署
# 用法:
#   cd deploy/aliyun
#   cp .env.example .env
#   编辑 .env
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiguang}
      POSTGRES_USER: ${POSTGRES_USER:-shiguang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiguang-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiguang} -d ${POSTGRES_DB:-shiguang}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: deploy/aliyun/Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-shiguang}:${POSTGRES_PASSWORD:-shiguang-change-me}@db:5432/${POSTGRES_DB:-shiguang}?connect_timeout=30
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-to-a-strong-random-value}
      JWT_EXPIRES_IN: 2h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      # 邮件（验证/找回密码），留空则使用 Ethereal 测试模式
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-拾光互助 <no-reply@shiguang.dev>}
      # 管理员 seed 信息（仅供初始化，不是每次启动都执行）
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shiguang.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../..
      dockerfile: deploy/aliyun/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
