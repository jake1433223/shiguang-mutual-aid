<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO 基础 -->
    <title>拾光互助 — 让每一刻空闲都有人接住</title>
    <meta name="description" content="拾光互助 — 让每一刻空闲都有价值。发布你的小需求，或用碎片时间帮别人一个忙，收获拾光币与感谢。" />
    <meta name="keywords" content="互助,拾光互助,闲置时间,技能交换,校园互助,需求广场" />
    <meta name="author" content="拾光互助团队" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph（微信/QQ/微博等分享卡片） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="拾光互助" />
    <meta property="og:title" content="拾光互助 — 让每一刻空闲都有人接住" />
    <meta property="og:description" content="发布你的小需求，或用碎片时间帮别人一个忙。让每一刻空闲都有价值。" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="拾光互助 — 让每一刻空闲都有人接住" />
    <meta name="twitter:description" content="发布你的小需求，或用碎片时间帮别人一个忙。让每一刻空闲都有价值。" />

    <!-- 结构化数据：WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "拾光互助",
        "description": "让每一刻空闲都有价值的互助平台",
        "inLanguage": "zh-CN"
      }
    </script>

    <!-- 字体：preconnect 加速加载 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
